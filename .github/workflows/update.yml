name: update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
            
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '18'
                cache: 'npm'
                cache-dependency-path: .github/update/package-lock.json

            - name: Install dependencies
              working-directory: .github/update
              run: npm ci
            
            - name: Run update script
              working-directory: .github/update
              run: npm run update
